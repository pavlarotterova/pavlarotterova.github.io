<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mgr. Pavla Rotterová, Ph.D. - Postklasická homeopatie</title>
    <style>
        :root {
            --temna-zelena: #1e3a1f;
            --svetla-zelena: #f4f9e4; /* Vaše světlá žlutozelená */
            --text-hlavni: #1f2b20;
            --text-svetly: #4e5e4f;
            --bila: #ffffff;
            --oranzova-akcent: #ff7b00; /* Sjednocená oranžová */
            --teply-gradient: linear-gradient(135deg, #ffd000 0%, var(--oranzova-akcent) 50%, #d90429 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--svetla-zelena);
            color: var(--text-hlavni);
            margin: 0;
            padding: 20px 20px 40px 20px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .kontejner {
            max-width: 650px;
            width: 100%;
        }

        /* Navigační menu */
        .hlavni-nav {
            margin-bottom: 25px;
        }

        .hlavni-menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .menu-odkaz {
            display: inline-block;
            background: var(--bila);
            color: var(--text-svetly);
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(30, 58, 31, 0.05);
            transition: all 0.3s ease;
        }

        .menu-odkaz:hover {
            color: var(--temna-zelena);
            transform: translateY(-2px);
        }

        .menu-odkaz.aktivni {
            background: var(--oranzova-akcent); /* Změna na vaši oranžovou */
            color: var(--bila);
            box-shadow: 0 4px 15px rgba(255, 123, 0, 0.3);
        }

        /* Hlavní vizitka */
        .karta-hlavni {
            background: var(--bila);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(30, 58, 31, 0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Nové styly pro dokonale shodný horní a spodní pruh */
        .pruh-horni, .pruh-spodni {
            position: absolute;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #ffd000 0%, var(--oranzova-akcent) 50%, #d90429 100%);
        }
        .pruh-horni { top: 0; }
        .pruh-spodni { bottom: 0; }

        .linie-prechodu {
            height: 5px;
            width: 80px;
            background: var(--teply-gradient);
            margin: 20px auto;
            border-radius: 3px;
        }

        h1 {
            color: var(--temna-zelena);
            margin: 0 0 5px 0;
            font-size: 2.2rem;
        }

        h2 {
            color: var(--oranzova-akcent);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
            margin: 0;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-svetly);
            margin: 15px 0;
            text-align: center;
        }

        .status-box {
             background: var(--svetla-zelena);
             padding: 12px 20px;
             border-radius: 10px;
            font-size: 0.95rem;
            color: var(--temna-zelena);
            font-weight: 600;
            display: inline-block;
            margin-top: 15px;
            border: 1px solid var(--oranzova-akcent); /* Změna na tenkou oranžovou linku */
        }
    </style>
</head>
<body>

    <div class="kontejner">
        
        <!-- Navigační menu -->
        <nav class="hlavni-nav">
            <ul class="hlavni-menu">
                <li><a href="index.html" class="menu-odkaz aktivni">Úvod</a></li>
                <li><a href="o-mne.html" class="menu-odkaz">O mně</a></li>
                <li><a href="lecba.html" class="menu-odkaz">Průběh léčby</a></li>
                <li><a href="cenik.html" class="menu-odkaz">Ceník</a></li>
                <li><a href="kontakt.html" class="menu-odkaz">Kontakt</a></li>
            </ul>
        </nav>

    <div class="kontejner">
        <!-- Hlavní vizitka -->
        <div class="karta-hlavni">
            <div class="pruh-horni"></div> <!-- Tento řádek vložíte sem -->
           <h1>Mgr. Pavla Rotterová, Ph.D.</h1>
            <h2>Postklasická homeopatie</h2>
            <div class="linie-prechodu"></div>
            <p>Vítejte. Pomáhám rozplétat hluboké příčiny nemocí a vracet tělo i mysl zpět k jejich přirozenému zdraví.</p>
            <div class="status-box">
                🌱 Stránky pro vás momentálně připravuji
            </div>
            <div class="pruh-spodni"></div> <!-- Tento řádek vložíte sem těsně před uzavírací </div> -->
        </div>

    </div>

</body>
</html>
